<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهادات يوم المعلم - مدرسة عبدالرحمن بن عوف الإعدادية للبنين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --primary:#0c2340; --primary-dark:#071627; --primary-light:#1e4066;
    --gold:#b8882e; --gold-light:#e2bd6c; --gold-deep:#8f6a1f;
    --emerald:#0b6e5c; --emerald-light:#14967f; --emerald-dark:#084f42;
    --maroon:#8c1d2b; --bg:#eef1f6; --white:#fff; --text:#1a2530; --muted:#5f6c7b; --border:#e1e7ef;
    --shadow-sm:0 2px 10px rgba(12,35,64,.06); --shadow-md:0 10px 28px rgba(12,35,64,.10); --shadow-lg:0 24px 60px rgba(12,35,64,.16);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--bg); }
  body {
    font-family:'Cairo',sans-serif; color:var(--text); direction:rtl; min-height:100vh;
    background:radial-gradient(circle at 12% 8%, rgba(11,110,92,.06), transparent 40%),
               radial-gradient(circle at 92% 4%, rgba(184,136,46,.07), transparent 35%), var(--bg);
    padding:24px 14px; -webkit-font-smoothing:antialiased;
  }
  .page { max-width:920px; margin:0 auto; background:var(--white); border-radius:22px; overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid rgba(12,35,64,.05); }
  .header-img { display:block; width:100%; height:auto; }
  .caption { background:linear-gradient(120deg,var(--primary-dark),var(--primary) 55%,var(--primary-light)); color:#fff; text-align:center; padding:20px 26px 24px; border-bottom:3px solid var(--gold); }
  .eyebrow { display:inline-flex; gap:6px; align-items:center; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:30px; padding:5px 16px; font-size:12px; font-weight:700; margin-bottom:10px; }
  .caption h1 { font-size:21px; font-weight:900; line-height:1.5; }
  .caption p { font-size:13px; opacity:.88; margin-top:6px; font-weight:600; }

  .body { padding:26px 28px 30px; max-width:680px; margin:0 auto; }
  label.lbl { display:block; font-size:14px; font-weight:700; color:var(--primary); margin-bottom:10px; }
  .search-row { position:relative; }
  .search-row input {
    width:100%; padding:14px 20px 14px 48px; font-size:16px; font-family:inherit; direction:rtl;
    border:2px solid var(--border); border-radius:30px; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .search-row input:focus { border-color:var(--emerald); box-shadow:0 0 0 4px rgba(11,110,92,.10); }
  .clear-btn { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:none; border-radius:50%; background:#f0f4f8; color:var(--muted); font-size:14px; cursor:pointer; display:none; }
  .clear-btn.show { display:block; }
  .hint { font-size:12px; color:var(--muted); margin-top:9px; text-align:center; }

  #results { margin-top:18px; }
  .count { font-size:12.5px; color:var(--muted); text-align:center; margin:2px 0 10px; }
  .list { display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px; }
  .row {
    display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:right; width:100%;
    background:#f9fbfd; border:1.5px solid #eef2f7; border-radius:14px; padding:12px 16px; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:700; color:var(--primary); transition:background .15s, border-color .15s;
  }
  .row:hover { background:#f0f7f5; }
  .row.active { background:#eaf7f2; border-color:var(--emerald); }
  .row .arrow { color:var(--emerald); font-size:18px; flex-shrink:0; }
  .empty { padding:14px; background:#fdf1ee; color:var(--maroon); border-radius:12px; text-align:center; font-weight:600; font-size:13.5px; }

  .panel { margin-top:16px; background:linear-gradient(180deg,#fbfcfe,#fff); border:1px solid var(--border); border-right:5px solid var(--emerald); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow-sm); text-align:center; }
  .panel .tag { display:inline-block; background:linear-gradient(135deg,var(--emerald-dark),var(--emerald)); color:#fff; border-radius:7px; padding:4px 14px; font-size:12px; font-weight:700; margin-bottom:10px; }
  .panel .nm { font-size:19px; font-weight:900; color:var(--primary); margin-bottom:14px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .actions button {
    flex:1 1 130px; padding:12px 16px; border:none; border-radius:30px; font-family:inherit; font-size:13.5px; font-weight:700; color:#fff; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .15s, opacity .15s;
  }
  .actions button:hover:not(:disabled) { transform:translateY(-2px); }
  .actions button:disabled { opacity:.55; cursor:wait; }
  .b-view { background:linear-gradient(120deg,var(--primary-dark),var(--primary)); box-shadow:0 4px 14px rgba(12,35,64,.22); }
  .b-dl   { background:linear-gradient(120deg,var(--gold-deep),var(--gold)); box-shadow:0 4px 14px rgba(184,136,46,.26); }
  .b-print{ background:linear-gradient(120deg,var(--emerald),var(--emerald-light)); box-shadow:0 4px 14px rgba(11,110,92,.28); }
  .status { font-size:12.5px; color:var(--muted); margin-top:10px; min-height:18px; }
  footer { text-align:center; padding:6px 20px 22px; color:var(--muted); font-size:11.5px; }

  @media (max-width:560px) {
    body { padding:0; } .page { border-radius:0; box-shadow:none; }
    .caption { padding:16px 16px 20px; } .caption h1 { font-size:17px; }
    .body { padding:20px 16px 24px; } .list { max-height:300px; }
    .actions button { flex:1 1 100%; }
  }
</style>
</head>

/* ---------- تطبيع النص العربي للبحث المرن ---------- */
function norm(s) {
  return s
    .replace(/[\u064B-\u065F\u0670\u0640]/g, '')   // التشكيل والتطويل
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي')
    .replace(/\./g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
CERTS.forEach(c => { c.k = norm(c.n); c.ks = c.k.replace(/ /g, ''); });

function search(q) {
  const nq = norm(q);
  if (!nq) return [];
  const tokens = nq.split(' ');
  const flat = nq.replace(/ /g, '');
  return CERTS.filter(c =>
    tokens.every(t => c.k.indexOf(t) !== -1) || c.ks.indexOf(flat) !== -1
  );
}

/* ---------- استخراج صفحة الشهادة ---------- */
function b64ToBytes(b64) {
  const bin = atob(b64), len = bin.length, out = new Uint8Array(len);
  for (let i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
  return out;
}
let srcDocPromise = null;
function getSrcDoc() {
  if (!srcDocPromise) srcDocPromise = PDFLib.PDFDocument.load(b64ToBytes(PDF_B64));
  return srcDocPromise;
}
const urlCache = {};
async function getCertUrl(pageIndex) {
  if (urlCache[pageIndex]) return urlCache[pageIndex];
  const src = await getSrcDoc();
  const out = await PDFLib.PDFDocument.create();
  const [pg] = await out.copyPages(src, [pageIndex]);
  out.addPage(pg);
  const bytes = await out.save();
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  urlCache[pageIndex] = url;
  return url;
}

/* ---------- الواجهة ---------- */
const qEl = document.getElementById('q');
const clearEl = document.getElementById('clear');
const resEl = document.getElementById('results');
const panelEl = document.getElementById('panel');
let selected = null;

function render() {
  const q = qEl.value;
  clearEl.classList.toggle('show', q.length > 0);
  resEl.textContent = '';
  panelEl.textContent = '';
  selected = null;
  if (!norm(q)) return;

  const matches = search(q);
  if (!matches.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'لا توجد شهادة مطابقة، تأكد من كتابة الاسم بشكل صحيح';
    resEl.appendChild(d);
    return;
  }
  const cnt = document.createElement('div');
  cnt.className = 'count';
  cnt.textContent = matches.length === 1 ? 'تم العثور على نتيجة واحدة' : 'عدد النتائج: ' + matches.length;
  resEl.appendChild(cnt);

  const list = document.createElement('div');
  list.className = 'list';
  matches.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'row';
    const s = document.createElement('span');
    s.textContent = c.n;
    const a = document.createElement('span');
    a.className = 'arrow';
    a.textContent = '‹';
    b.appendChild(s); b.appendChild(a);
    b.addEventListener('click', () => select(c, b));
    list.appendChild(b);
  });
  resEl.appendChild(list);
  if (matches.length === 1) select(matches[0], list.firstChild);
}

async function select(c, rowEl) {
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  if (rowEl) rowEl.classList.add('active');
  selected = c;

  panelEl.textContent = '';
  const p = document.createElement('div'); p.className = 'panel';
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = '✔ شهادة شكر وتقدير';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = c.n;
  const act = document.createElement('div'); act.className = 'actions';
  const bView = mkBtn('b-view', '🔍 عرض الشهادة');
  const bDl = mkBtn('b-dl', '⬇️ تنزيل PDF');
  const bPr = mkBtn('b-print', '🖨️ طباعة');
  [bView, bDl, bPr].forEach(b => { b.disabled = true; act.appendChild(b); });
  const st = document.createElement('div'); st.className = 'status'; st.textContent = 'جاري تجهيز الشهادة...';
  p.appendChild(tag); p.appendChild(nm); p.appendChild(act); p.appendChild(st);
  panelEl.appendChild(p);
  p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  try {
    const url = await getCertUrl(c.p);
    if (selected !== c) return;           // تغيّر الاختيار أثناء التجهيز
    st.textContent = '';
    [bView, bDl, bPr].forEach(b => b.disabled = false);
    bView.onclick = () => window.open(url, '_blank');
    bDl.onclick = () => download(url, c.n);
    bPr.onclick = () => printPdf(url);
  } catch (e) {
    console.error(e);
    st.textContent = 'تعذّر تجهيز الشهادة، حدّث الصفحة وحاول مرة أخرى';
  }
}

function mkBtn(cls, text) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = cls; b.textContent = text;
  return b;
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url;
  a.download = 'شهادة_' + name.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_') + '.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function printPdf(url) {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (isMobile) { window.open(url, '_blank'); return; }   // على الجوال تُطبع من عارض PDF
  const old = document.getElementById('print-frame');
  if (old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'print-frame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  f.src = url;
  f.onload = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { window.open(url, '_blank'); }
  };
  document.body.appendChild(f);
}

qEl.addEventListener('input', render);
clearEl.addEventListener('click', () => { qEl.value = ''; render(); qEl.focus(); });
</script>
</body>
</html>
